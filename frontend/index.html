<head>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer>
  </script>
</head>
<div id="topbar">
  <button id="topbar-scan">
    SCAN
  </button>
  <button id="topbar-cards">
    CARDS
  </button>
</div>
<div id="upload-section" class="section">
  <h1>
    upload image
  </h1>
  <input type="file" id="photo" accept="image/*" capture="enviornment">
  <p>
  </p>
  <button id="uploader-button">
    UPLOAD
  </button>
  <img id="preview" style="display:none">
  <p id="uploadstatus">
    ...
  </p>
  <h1>
    text extraction
  </h1>
  <button id="ocr-button">
    GET TEXT
  </button>
  <div id="ocr" style="display:none">
    <br>
    <br>
    <textarea id="ocr-result" rows="10" placeholder="...">
    </textarea>
    <p id="ocr-confidence">
      confidence: 67%
    </p>
    <button id="createnewcard">
      CREATE CARD
    </button>
    <p>
    </p>
    <button id="autocreatenewcard">
      AUTOFILL CARD
    </button>
  </div>
  <p id="ocr-status">
    waiting...
  </p>
</div>
<div id="cards-section" class="section">
  <h1>
    cards
  </h1>
  <button id="createnewcard2">
    CREATE
  </button>
  <div id="card-list-container">
  </div>
  <p id="card-list-empty">
  </p>
</div>
<div class="section" id="cardform-section" >
  <h2>
    create card
  </h2>
  <p id="form-label">
    profile
  </p>
  <input type="text" id="form-profile" required>
</input>
<p id="form-label">
  product name
</p>
<input type="text" id="form-productname" required>
</input>
<p id="form-label">
  strength
</p>
<input type="text" id="form-strength">
</input>
<p id="form-label">
  instructions
</p>
<textarea type="text" id="form-instructions" rows="3" resize:vertical>
</textarea>
<p id="form-label">
  notes
</p>
<textarea type="text" id="form-notes" rows="3" resize:vertical>
</textarea>
<p id="form-label">
  warnings
</p>
<textarea type="text" id="form-warnings" rows="2" resize:vertical>
</textarea>
<p id="form-label">
  ocr text
</p>
<textarea type="text" id="form-ocrtext" rows="3" readonly resize:vertical>
  ...
</textarea>
<p id="form-label">
  time
</p>
<input type="time" id="form-time">
</input>
<input type="text" id="form-imagepath" hidden>
</input>
<p id="form-status">
  ...
</p>
<button id="form-submit">
  SUBMIT
</button>
<button id="form-cancel">
  CANCEL
</button>
</div>

<div id="card-detail" class="section">
  <button id="close-detail">
    <b>╳</b>
  </button>
<div id="card-detail-2">

  <br>
  <img id="detail-image" style="max-width:300px; max-height:200px;" class="card-image">
</img>
<div id="card-detail-content" class="card">
</div>
<div class="last-taken"></div>
<button id="card-taken">
i took ts</button>
<button id="card-edit">
  EDIT
</button>
<button id="card-yeet">
  RECYCLE
</button>

<button id="edit-submit" style="display:none;">SUBMIT</button>
<button id="edit-cancel" style="display:none;">CANCEL</button>

<button id="card-readaloud">
  READ ALOUD
</button>
</div>
</div>

<div id="identify-section" class="section" hidden>
<h1 class="identify-title">bottle matcher</h1>
<button id="identify-photo-button" class="identify-photo" style="display:block">take picture</button>
  <input type="file" id="identify-input" accept="image/*" capture="environment" hidden style="display:none"></input>
  <label for="identify-input-alt" class="identify-alt-label">or upload a photo</label>
    <input type="file" id="identify-input-alt" accept="image/*"></input>
	
	
	<div id="identify-result" style="display:none"></div>
	




</div>

<div id="overlay" style="display:none;"></div>
